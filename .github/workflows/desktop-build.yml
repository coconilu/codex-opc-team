name: Desktop build

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-build.yml"
      - "apps/opc-desktop/**"
      - "plugins/codex-opc-team/**"
      - "tests/unit/test_opc_desktop_contract.py"
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - ".github/workflows/desktop-build.yml"
      - "apps/opc-desktop/**"
      - "plugins/codex-opc-team/**"
      - "tests/unit/test_opc_desktop_contract.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-nsis:
    name: Windows x64 unsigned NSIS
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: always
    defaults:
      run:
        working-directory: apps/opc-desktop

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/opc-desktop/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/opc-desktop/requirements-build.txt

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/opc-desktop/src-tauri -> target

      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts

      - name: Validate desktop distribution contracts
        working-directory: .
        run: python -m unittest tests.unit.test_opc_desktop_contract -v

      - name: Build unsigned current-user NSIS installer
        run: npm run tauri:build

      - name: Generate installer SHA-256
        id: installer
        shell: pwsh
        run: |
          $bundleRoot = "src-tauri/target/release/bundle/nsis"
          $installers = @(Get-ChildItem -LiteralPath $bundleRoot -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installers.Count)."
          }
          $installer = $installers[0]
          $algorithm = [System.Security.Cryptography.SHA256]::Create()
          $stream = [System.IO.File]::OpenRead($installer.FullName)
          try {
            $hashBytes = $algorithm.ComputeHash($stream)
            $hash = (($hashBytes | ForEach-Object { $_.ToString("x2") }) -join "")
          } finally {
            $stream.Dispose()
            $algorithm.Dispose()
          }
          "$hash  $($installer.Name)" |
            Set-Content -LiteralPath "$($installer.FullName).sha256" -Encoding ascii
          "installer_name=$($installer.Name)" >> $env:GITHUB_OUTPUT
          "installer_sha256=$hash" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned installer
        uses: actions/upload-artifact@v4
        with:
          name: opc-app-windows-x64-unsigned-${{ github.sha }}
          path: |
            apps/opc-desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/opc-desktop/src-tauri/target/release/bundle/nsis/*.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Summarize build
        shell: pwsh
        run: |
          @"
          ## OPC App Windows build

          - Node.js: 24
          - Package: ${{ steps.installer.outputs.installer_name }}
          - SHA-256: ``${{ steps.installer.outputs.installer_sha256 }}``
          - Signing: unsigned development artifact
          "@ >> $env:GITHUB_STEP_SUMMARY
