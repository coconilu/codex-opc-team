[package]
name = "opc-desktop"
version = "0.1.1"
description = "Tauri lifecycle and distribution shell for the OPC App"
authors = ["Codex OPC Team contributors"]
edition = "2021"
rust-version = "1.77.2"
license = "Apache-2.0"

[lib]
name = "opc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-shell = "=2.3.5"
tauri-plugin-single-instance = "=2.4.3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
